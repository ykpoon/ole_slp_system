<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>香港紅卍字會大埔卍慈中學 - OLE 活動與通告管理平台</title>
    <!-- 沿用 reset.css 與定制之 style.css -->
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <h3 class="header-text">
        香港紅卍字會大埔卍慈中學 — 教職員 OLE 與學生表現管理系統
      </h3>
      <h1 class="title">活動擬定、通告發放及 SLP 生成平台</h1>

      <!-- 系統狀態與使用說明區塊 (採用 details 分欄設計) -->
      <div class="details no-print">
        <div class="details__left">
          <span class="details__left-text">當前學年: 2025-2026</span>
          <span class="details__left-text">通告範本: ECA / PE 標準格式</span>
          <span class="details__left-text">平台狀態: 數據庫在線</span>
        </div>
        <div class="details__right">
          <p class="details__right-text">
            歡迎使用。為確保每項舉行之活動均有記錄，請先在此發起活動並下載通告草稿微調。儲存後，名單登記庫將自動同步該活動，以供後續補入參與學生名單與獲獎資訊，並支援一鍵匯出大學報讀標準
            SLP。
          </p>
        </div>
      </div>

      <!-- 功能切換標籤 -->
      <nav class="nav-menu no-print">
        <button
          id="tab-btn-activity"
          class="nav-tab-btn active"
          onclick="switchTab('activity')"
        >
          1. 活動發起與通告
        </button>
        <button
          id="tab-btn-record"
          class="nav-tab-btn"
          onclick="switchTab('record')"
        >
          2. 名單與獎項登記
        </button>
        <button
          id="tab-btn-slp"
          class="nav-tab-btn"
          onclick="switchTab('slp')"
        >
          3. 大學 SLP 預覽
        </button>
      </nav>

      <!-- ================= 區塊 1: 活動發起與通告 ================= -->
      <section id="section-activity" class="steps__section">
        <h3 class="steps__sub-title">
          <strong>活動基本設定與通告輸出</strong>
        </h3>

        <form id="activityForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="actYear">學年</label>
              <select id="actYear" class="form-control">
                <option value="26/27">2026-2027</option>
                <option value="25/26" selected>2025-2026</option>
                <option value="24/25">2024-2025</option>
              </select>
            </div>

            <div class="form-group">
              <label for="actNoticeNo">通告編號 (如: 2627-ECA019)</label>
              <input
                type="text"
                id="actNoticeNo"
                value="2627-ECA019"
                class="form-control"
              />
            </div>

            <div class="form-group">
              <label for="actOrganizer">主辦科組</label>
              <select id="actOrganizer" class="form-control">
                <option value="體育科">體育科</option>
                <option value="視覺藝術科">視覺藝術科</option>
                <option value="升學及就業輔導組">升學及就業輔導組</option>
                <option value="課外活動組">課外活動組</option>
                <option value="學生發展委員會">學生發展委員會</option>
              </select>
            </div>

            <div class="form-group">
              <label for="actTeacher">負責老師</label>
              <select id="actTeacher" class="form-control">
                <option value="張梓烽">張梓烽 老師</option>
                <option value="朱賢煒">朱賢煒 老師</option>
                <option value="鄭鍵鴻">鄭鍵鴻 老師</option>
                <option value="黃文禮">黃文禮 老師</option>
                <option value="潘裕錡">潘裕錡 老師</option>
              </select>
            </div>

            <div class="form-group form-full">
              <label for="actTitle">活動名稱</label>
              <input
                type="text"
                id="actTitle"
                value="田徑隊訓練"
                class="form-control"
              />
            </div>

            <div class="form-group">
              <label for="actCategory">OLE 範疇</label>
              <select id="actCategory" class="form-control">
                <option value="體育發展">體育發展</option>
                <option value="藝術發展">藝術發展</option>
                <option value="德育及公民教育">德育及公民教育</option>
                <option value="社會服務">社會服務</option>
                <option value="與工作有關的經驗">與工作有關的經驗</option>
              </select>
            </div>

            <div class="form-group">
              <label for="actHours">活動時數 (小時)</label>
              <input type="number" id="actHours" value="8" class="form-control" />
            </div>

            <div class="form-group form-full">
              <label for="actDate">活動日期 / 週期描述</label>
              <input
                type="text"
                id="actDate"
                value="2026年9月23日至2026年12月16日（逢星期一、二、三）"
                class="form-control"
              />
            </div>

            <div class="form-group">
              <label for="actTime">活動時間</label>
              <input
                type="text"
                id="actTime"
                value="5:00 p.m. - 6:40 p.m."
                class="form-control"
              />
            </div>

            <div class="form-group">
              <label for="actLocation">活動地點</label>
              <select id="actLocation" class="form-control">
                <option value="學校籃球場及操場">學校籃球場及操場</option>
                <option value="大埔運動場">大埔運動場</option>
                <option value="本校禮堂">本校禮堂</option>
                <option value="視覺藝術室">視覺藝術室</option>
              </select>
            </div>

            <div class="form-group">
              <label for="actAttire">服飾要求</label>
              <select id="actAttire" class="form-control">
                <option value="穿著田徑隊隊衣">穿著田徑隊隊衣</option>
                <option value="整齊校服">整齊校服</option>
                <option value="學校指定體育服裝">學校指定體育服裝</option>
              </select>
            </div>

            <div class="form-group">
              <label for="actFee">費用</label>
              <select id="actFee" class="form-control">
                <option value="全免">全免</option>
                <option value="收取指定費用 (由校方津貼部分)">收取指定費用 (由校方津貼部分)</option>
              </select>
            </div>

            <div class="form-group form-full">
              <label for="actPurpose">活動目標與內文說明</label>
              <textarea id="actPurpose" rows="2" class="form-control">為讓學生接受系統性訓練，準備本年度校際比賽，本校體育科將舉行「田徑隊訓練」活動。</textarea>
            </div>
          </div>

          <div class="btn-group no-print">
            <button
              type="button"
              onclick="downloadWordNotice()"
              class="btn btn-outline"
            >
              📄 下載 Word 通告草稿 (.doc)
            </button>
            <button
              type="button"
              onclick="saveActivityAndSync()"
              class="btn btn-primary"
            >
              💾 儲存活動並同步至名單庫
            </button>
          </div>
        </form>
      </section>

      <!-- ================= 區塊 2: 名單與獎項登記 ================= -->
      <section id="section-record" class="steps__section hidden">
        <h3 class="steps__sub-title">
          <strong>學生參與名單與成就登記</strong>
          <button onclick="quickAddStudent()" class="btn btn-outline" style="font-size: 12px; padding: 4px 10px;">
            + 登記學生
          </button>
        </h3>

        <!-- 動態連動下拉選單 -->
        <div style="margin-bottom: 15px;">
          <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">
            請選擇欲處理之活動：
          </label>
          <select
            id="activitySelector"
            onchange="renderStudentRecords()"
            class="form-control"
            style="font-weight: 600;"
          >
            <!-- 由 JS 自動填入所有已登記之活動 -->
          </select>
        </div>

        <div id="activityMetaText" class="details__right-text" style="margin-bottom: 15px;">
          <!-- 顯示當前活動資訊摘要 -->
        </div>

        <table class="data-table">
          <thead>
            <tr>
              <th>學年</th>
              <th>班別</th>
              <th>班號</th>
              <th>學生姓名</th>
              <th>角色</th>
              <th>時數</th>
              <th>成就 / 獎項</th>
              <th style="text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- 由 JS 渲染對應活動的學生名單 -->
          </tbody>
        </table>
      </section>

      <!-- ================= 區塊 3: 大學 SLP 預覽 ================= -->
      <section id="section-slp" class="steps__section hidden">
        <h3 class="steps__sub-title no-print">
          <strong>學生學習概覽 (SLP) 即時預覽</strong>
          <button onclick="window.print()" class="btn btn-primary" style="font-size: 12px; padding: 4px 12px;">
            🖨️ 列印 / 存為 PDF
          </button>
        </h3>

        <!-- SLP 生成渲染容器 -->
        <div id="slpRenderContainer" class="printable">
          <!-- JS 動態生成標準格式 -->
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
